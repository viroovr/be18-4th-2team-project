name: CI Build & Jenkins Trigger (Windows)

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-test:
    runs-on: self-hosted   # Windows runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test (Gradle + Docker)
        shell: cmd
        run: |
          cd backend
          call gradlew.bat clean build test
          docker build -t %DOCKER_REPO%:%GITHUB_SHA% .
          echo %DOCKER_PASSWORD% | docker login -u %DOCKER_USERNAME% --password-stdin
          docker push %DOCKER_REPO%:%GITHUB_SHA%
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

      - name: Trigger Jenkins Stage Deployment
        if: success()
        shell: cmd
        run: |
          curl -u "jenkins_user:${{ secrets.JENKINS_API_TOKEN }}" ^
            -X POST "http://localhost:8080/job/stage-deploy/buildWithParameters" ^
            --data "IMAGE_TAG=${{ github.sha }}&BRANCH=${{ github.ref_name }}"

name: CI Build & Jenkins Trigger

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-test:
    runs-on: self-hosted  # ✅ ubuntu-latest → self-hosted 로 변경
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for Gradlew
        run: chmod +x ./backend/gradlew

      - name: Build & Test
        run: |
          cd backend
          ./gradlew clean build test
          docker build -t ${{ secrets.DOCKER_REPO }}:${{ github.sha }} .
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push ${{ secrets.DOCKER_REPO }}:${{ github.sha }}
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

      - name: Trigger Jenkins Stage Deployment
        if: success()
        run: |
          curl -u "jenkins_user:${{ secrets.JENKINS_API_TOKEN }}" \
            -X POST "http://localhost:8080/job/stage-deploy/buildWithParameters" \
            --data "IMAGE_TAG=${{ github.sha }}&BRANCH=${{ github.ref_name }}"


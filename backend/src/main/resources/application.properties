spring.application.name=backend

# =========================
# DB (MariaDB)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# =========================
# JWT
# =========================
spring.jwt.secret=${SPRING_JWT_SECRET}

app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:900000}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:1209600000}
app.jwt.invite-ttl=${APP_JWT_INVITE_TTL:604800000}

# Redis Prefix
app.redis.prefix.refresh=${APP_REDIS_PREFIX_REFRESH:specguard:refresh:}
app.redis.prefix.blacklist=${APP_REDIS_PREFIX_BLACKLIST:specguard:blacklist:}

# =========================
# SendGrid
# =========================
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.mail.from=${SENDGRID_MAIL_FROM:dyungwoo3600@gmail.com}
sendgrid.mail.from-name=${SENDGRID_MAIL_FROM_NAME:Amicitia}
invite.base-url=${INVITE_BASE_URL:http://localhost:5173/signup/invite}

# =========================
# OAuth2 Google
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.provider.google.authorization-uri=${GOOGLE_AUTH_URI}
spring.security.oauth2.client.provider.google.token-uri=${GOOGLE_TOKEN_URI}
spring.security.oauth2.client.provider.google.user-info-uri=${GOOGLE_USERINFO_URI}

# =========================
# OAuth2 Naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri=${NAVER_REDIRECT_URI}
spring.security.oauth2.client.provider.naver.authorization-uri=${NAVER_AUTH_URI}
spring.security.oauth2.client.provider.naver.token-uri=${NAVER_TOKEN_URI}
spring.security.oauth2.client.provider.naver.user-info-uri=${NAVER_USERINFO_URI}

# =========================
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:1}

# =========================
# File Storage
app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:./uploads}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# Scheduling Cleanup
app.timezone=Asia/Seoul
app.cleanup.resume.enabled=true
app.cleanup.resume.cron=0 10 3 * * *
app.cleanup.resume.chunk-size=100
app.cleanup.resume.dry-run=false
spring.task.scheduling.pool.size=2

# =========================
# Logging
logging.level.com.beyond.specguard=${LOGGING_LEVEL_SPECGUARD:DEBUG}
logging.level.org.springframework.mail=${LOGGING_LEVEL_MAIL:DEBUG}
logging.level.org.springframework.data.redis=${LOGGING_LEVEL_REDIS:DEBUG}
logging.level.org.springframework.boot.autoconfigure.mail=${LOGGING_LEVEL_AUTOMAIL:DEBUG}
